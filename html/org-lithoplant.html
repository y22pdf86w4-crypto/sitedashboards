<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Organograma - Lithoplant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../assets/imagem/favicon.png" type="image/png" />

  <link rel="stylesheet" href="../assets/css/org-Lithoplant.css" />
  <script src="../assets/js/global.js" defer></script>

  <script defer>
    function carregarOrganograma() {
      const user = getUsuarioAtual();
      if (!user) {
        window.location.href = "../index.html";
        return;
      }

      preencherHeaderUsuario(user, "saudacaoSidebar", "userNameSidebar");

      const app = document.getElementById("app");
      const btnToggle = document.getElementById("btnToggleSidebar");
      if (app && btnToggle) {
        btnToggle.addEventListener("click", () => {
          app.classList.toggle("sidebar-collapsed");
        });
      }
    }

    function ativarItemSidebar(chave) {
      document.querySelectorAll(".sidebar-item").forEach(item => {
        item.classList.toggle("sidebar-item-active", item.dataset.key === chave);
      });

      if (chave === "dashboards") {
        window.location.href = "./menu.html";
      } else if (chave === "calendario") {
        window.location.href = "./calendario.html";
      } else if (chave === "organograma") {
        // já está aqui
      }
    }

    function trocarParaMenu() {
      window.location.href = "./menu.html";
    }

    function voltarLogin() {
      deslogar();
    }

    window.addEventListener("DOMContentLoaded", carregarOrganograma);
  </script>
</head>
<body>
  <div class="bg-container">
    <div class="animated-bg"></div>
    <div class="grid-bg"></div>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="particles-container"></div>

    <div class="wave-container">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>
  </div>

  <button class="sidebar-toggle" type="button" id="btnToggleSidebar" aria-label="Alternar menu lateral">
    <span>☰</span>
  </button>

  <div class="app" id="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">OG</div>
        <div class="sidebar-title-block">
          <span class="sidebar-title" id="saudacaoSidebar">Organograma</span>
          <span class="sidebar-sub" id="userNameSidebar">Linhagro</span>
        </div>
      </div>

      <div class="sidebar-section">
        <p class="sidebar-section-title">Navegação</p>
        <ul class="sidebar-nav">
          <li class="sidebar-item" onclick="trocarParaMenu()">
            <span class="icon">⬅</span>
            <span class="label">Voltar ao menu</span>
          </li>

          <li class="sidebar-item" data-key="dashboards"
              onclick="ativarItemSidebar('dashboards')">
            <span class="icon">📊</span>
            <span class="label">Dashboards</span>
          </li>

          <li class="sidebar-item" data-key="calendario"
              onclick="ativarItemSidebar('calendario')">
            <span class="icon">📅</span>
            <span class="label">Calendário</span>
          </li>

          <li class="sidebar-item sidebar-item-active" data-key="organograma"
              onclick="ativarItemSidebar('organograma')">
            <span class="icon">👥</span>
            <span class="label">Organograma</span>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <button class="Btn sidebar-logout-btn" type="button" onclick="voltarLogin()">
          <div class="sign">
            <svg viewBox="0 0 512 512">
              <path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"></path>
            </svg>
          </div>
          <div class="text">Sair</div>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="org-header">
        <span class="main-kicker">Estrutura organizacional</span>
        <h1 class="main-title">
          Organograma <span>Lithoplant</span>
        </h1>
        <p class="main-sub">
          Visualização hierárquica das áreas, diretoria e equipes da Linhagro.
        </p>
      </header>

      <section class="org-image-wrapper" aria-label="Organograma Lithoplant">
        <div class="org-image-card">
          <img
            src="../assets/imagem/org-lithoplant.png"
            alt="Organograma completo Lithoplant"
          />
        </div>
      </section>
    </main>
  </div>
</body>
</html>
