<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Organograma - Lithoplant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../assets/imagem/favicon.png" type="image/png" />

  <!-- CSS globais / fundo -->
  <link rel="stylesheet" href="../assets/css/background.css" />
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/menu.css" />
  <!-- sidebar padrão -->
  <link rel="stylesheet" href="../assets/css/sidebar.css" />
  <!-- CSS específico organograma Lithoplant -->
  <link rel="stylesheet" href="../assets/css/org-Lithoplant.css" />

  <!-- JS globais -->
  <script src="../assets/js/global.js" defer></script>
  <!-- sidebar compartilhado -->
  <script src="../assets/js/sidebar.js" defer></script>

  <script defer>
    function voltarLogin() {
      if (typeof deslogar === "function") {
        deslogar();
      } else {
        window.location.href = "../index.html";
      }
    }

    async function carregarOrganogramaLitho() {
      const user =
        typeof getUsuarioAtual === "function" ? getUsuarioAtual() : null;

      if (!user) {
        window.location.href = "../index.html";
        return;
      }

      await carregarSidebar({
        containerId: "sidebarContainer",
        basePath: ".",
        empresaSelectorPath: "./select-company.html",
      });

      const liOrg = document.querySelector(
        ".sidebar-item[data-key='organograma']"
      );
      if (liOrg) {
        liOrg.classList.add("sidebar-item-active");
      }

      if (typeof preencherHeaderUsuario === "function") {
        preencherHeaderUsuario(user, "saudacaoSidebar", "userNameSidebar");
      }
    }

    window.addEventListener("DOMContentLoaded", carregarOrganogramaLitho);
  </script>
</head>
<body>
  <div class="bg-container">
    <div class="animated-bg"></div>
    <div class="grid-bg"></div>

    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="particles-container"></div>

    <div class="wave-container">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>
  </div>

  <button
    class="sidebar-toggle"
    type="button"
    id="btnToggleSidebar"
    aria-label="Alternar menu lateral"
  >
    <span>☰</span>
  </button>

  <div class="app" id="app">
    <!-- Sidebar compartilhada -->
    <div id="sidebarContainer"></div>

    <main class="main">
      <header class="org-header">
        <span class="main-kicker">Estrutura organizacional</span>
        <h1 class="main-title">
          Organograma <span>Lithoplant</span>
        </h1>
        <p class="main-sub">
          Visualização hierárquica das áreas, diretoria e equipes da Lithoplant.
        </p>
      </header>

      <section class="org-image-wrapper" aria-label="Organograma Lithoplant">
        <div class="org-image-card">
          <img
            src="../assets/imagem/org-lithoplant.png"
            alt="Organograma completo Lithoplant"
          />
        </div>
      </section>
    </main>
  </div>
</body>
</html>
