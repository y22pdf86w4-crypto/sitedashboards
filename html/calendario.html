<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Calendário de Pagamentos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="../assets/imagem/favicon.png" type="image/png" />

  <!-- CSS globais -->
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/background.css" />
  <!-- layout geral (fundo, etc. se compartilhado) -->
  <link rel="stylesheet" href="../assets/css/menu.css" />
  <!-- sidebar padrão -->
  <link rel="stylesheet" href="../assets/css/sidebar.css" />
  <!-- CSS específico calendário -->
  <link rel="stylesheet" href="../assets/css/calendario.css" />

  <!-- JS globais -->
  <script src="../assets/js/global.js" defer></script>
  <!-- sidebar compartilhado -->
  <script src="../assets/js/sidebar.js" defer></script>
  <!-- JS específico calendário -->
  <script src="../assets/js/calendario.js" defer></script>

  <script defer>
    function voltarLogin() {
      if (typeof deslogar === "function") {
        deslogar();
      } else {
        window.location.href = "../index.html";
      }
    }

    async function initCalendarioPagina() {
      // lógica original de init
      if (typeof initPagina === "function") {
        initPagina();
      }

      const user =
        typeof getUsuarioAtual === "function" ? getUsuarioAtual() : null;

      if (!user) {
        window.location.href = "../index.html";
        return;
      }

      // carrega sidebar compartilhada
      await carregarSidebar({
        containerId: "sidebarContainer",
        basePath: ".",
        empresaSelectorPath: "./select-company.html",
      });

      // marca item Calendário como ativo
      const liCalendario = document.querySelector(
        ".sidebar-item[data-key='calendario']"
      );
      if (liCalendario) {
        liCalendario.classList.add("sidebar-item-active");
      }

      // preenche header do sidebar
      if (typeof preencherHeaderUsuario === "function") {
        preencherHeaderUsuario(user, "saudacaoSidebar", "userNameSidebar");
      }

      // header do chip de usuário no topo da tela
      const userNameEl = document.getElementById("userName");
      if (userNameEl) {
        userNameEl.textContent = user.nome || user.email || "Usuário";
      }
    }

    window.addEventListener("DOMContentLoaded", initCalendarioPagina);
  </script>
</head>
<body class="calendario-page">
  <!-- Fundo animado -->
  <div class="bg-container" aria-hidden="true">
    <div class="animated-bg"></div>
    <div class="particles-container"></div>
    <div class="wave-container">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="grid-bg"></div>
  </div>

  <!-- Botão ☰ -->
  <button
    class="sidebar-toggle"
    type="button"
    id="btnToggleSidebar"
    aria-label="Alternar menu lateral"
  >
    <span>☰</span>
  </button>

  <div class="app" id="app">
    <!-- Sidebar compartilhada entra aqui -->
    <div id="sidebarContainer"></div>

    <main class="main">
      <header class="cal-header">
        <div class="cal-header-left">
          <div class="header-logo-pill">
            <div class="header-logo">
              <img
                id="logoEmpresaMobile"
                src="../assets/imagem/logolinhagro.png"
                alt="Empresa"
              />
            </div>
            <div class="header-text">
              <p class="header-title" id="headerTitle">Calendário de Pagamentos</p>
              <p class="header-subtitle" id="headerSub">
                Vencimentos e lembretes integrados ao financeiro da empresa selecionada.
              </p>
            </div>
          </div>
        </div>

        <div class="cal-header-right">
          <span class="header-pill">Ambiente produção</span>
          <div class="user-chip" id="userChip">
            <span class="status-dot"></span>
            <span id="userName">Usuário Padrão</span>
          </div>
        </div>
      </header>

      <section class="calendario-root">
        <section class="calendario-header">
          <div class="calendario-top-actions">
            <div class="calendario-mes-nav">
              <button type="button" onclick="mudarMes(-1)">◀</button>
              <span id="tituloMes">Mês de Ano</span>
              <button type="button" onclick="mudarMes(1)">▶</button>
            </div>

            <div class="calendario-search-row">
              <div class="calendario-search-wrapper">
                <span class="search-icon">🔍</span>
                <input
                  type="search"
                  id="buscaTexto"
                  class="filtro-input filtro-input-main"
                  placeholder="Buscar despesa..."
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                  readonly
                  onfocus="habilitarBuscaTexto(this)"
                />
              </div>

              <input
                type="email"
                style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0;"
                autocomplete="email"
              />

              <button
                type="button"
                class="btn-secondary btn-filter-toggle"
                onclick="abrirModalFiltros()"
              >
                <span class="filter-icon">⚙️</span>
                <span class="filter-text">Filtros</span>
              </button>
            </div>

            <div class="calendario-quick-actions">
              <button
                type="button"
                class="btn-chip"
                onclick="abrirModalSelecionarEnvio()"
              >
                <span class="icon">📲</span>
                <span>Enviar lembretes</span>
              </button>

              <button
                type="button"
                class="btn-chip"
                onclick="abrirGerenciadorContatos()"
              >
                <span class="icon">👥</span>
                <span>Contatos</span>
              </button>

              <button
                type="button"
                class="btn-chip"
                onclick="abrirModalInclusao()"
              >
                <span class="icon">➕</span>
                <span>Nova despesa</span>
              </button>
            </div>
          </div>
        </section>

        <section class="calendario-grid">
          <div class="week-header">
            <div>Dom</div>
            <div>Seg</div>
            <div>Ter</div>
            <div>Qua</div>
            <div>Qui</div>
            <div>Sex</div>
            <div>Sáb</div>
          </div>
          <div id="gridDias"></div>
        </section>
      </section>
    </main>
  </div>

  <!-- Modal de despesas do dia -->
  <div id="modalDia" class="modal-dia" style="display:none;">
    <div class="modal-dia-backdrop" onclick="fecharModalDia()"></div>
    <div class="modal-dia-panel">
      <header class="modal-dia-header">
        <h2 id="tituloModalDia">Despesas do dia</h2>
        <button
          type="button"
          class="modal-dia-close"
          onclick="fecharModalDia()"
        >
          ×
        </button>
      </header>

      <div class="modal-dia-body">
        <div id="listaDiaContainer"></div>
      </div>
    </div>
  </div>

  <!-- Loader global -->
  <div id="loaderGlobal" style="display:none;">
    <div class="loader-backdrop"></div>
    <div class="loader-spinner">
      <div class="spinner"></div>
      <div class="loader-text">Carregando...</div>
    </div>
  </div>

  <!-- Tooltip do calendário -->
  <div id="calTooltip" class="cal-tooltip" style="display:none;"></div>

  <!-- Modal filtros -->
  <div id="modalFiltros" class="modal-filtros" style="display:none;">
    <div class="modal-filtros-backdrop" onclick="fecharModalFiltros()"></div>
    <div class="modal-filtros-panel">
      <header class="modal-filtros-header">
        <h2>Filtros do calendário</h2>
        <button
          type="button"
          class="modal-filtros-close"
          onclick="fecharModalFiltros()"
        >
          ×
        </button>
      </header>

      <div class="modal-filtros-body">
        <div class="filtro-group">
          <label>Período</label>
          <div class="filtro-row">
            <input type="date" id="dataIni" />
            <span class="date-sep">–</span>
            <input type="date" id="dataFim" />
          </div>
        </div>

        <div class="filtro-group">
          <label>Status</label>
          <div class="chips-row">
            <button
              type="button"
              class="chip filtro-status"
              data-status="pendente"
              onclick="toggleFiltroStatus('pendente', this)"
            >
              Pendente
            </button>
            <button
              type="button"
              class="chip filtro-status"
              data-status="pago"
              onclick="toggleFiltroStatus('pago', this)"
            >
              Pago
            </button>
            <button
              type="button"
              class="chip filtro-status"
              data-status="atrasado"
              onclick="toggleFiltroStatus('atrasado', this)"
            >
              Atrasado
            </button>
          </div>
        </div>

        <div class="filtro-group">
          <label>Origem</label>
          <div class="chips-row" id="chipsOrigem"></div>
        </div>
      </div>

      <div class="modal-filtros-footer">
        <button
          type="button"
          class="btn-secondary"
          onclick="limparFiltros()"
        >
          Limpar
        </button>
        <button
          type="button"
          class="btn-primary"
          onclick="aplicarFiltros()"
        >
          Aplicar
        </button>
      </div>
    </div>
  </div>

  <!-- Modal inclusão / edição de despesa -->
  <div id="modalInclusao" class="modal-inclusao" style="display:none;">
    <div class="modal-inclusao-backdrop" onclick="fecharModalInclusao()"></div>
    <div class="modal-inclusao-panel">
      <header class="modal-inclusao-header">
        <h2 id="tituloModalInclusao">Nova despesa</h2>
        <button
          type="button"
          class="modal-inclusao-close"
          onclick="fecharModalInclusao()"
        >
          ×
        </button>
      </header>

      <div class="modal-inclusao-body">
        <form id="formDespesa">
          <input type="hidden" id="despesaId" />

          <div class="form-row">
            <div class="form-group">
              <label for="descDespesa">Descrição</label>
              <input type="text" id="descDespesa" required />
            </div>
            <div class="form-group">
              <label for="valorDespesa">Valor</label>
              <input type="number" id="valorDespesa" step="0.01" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="dataVencimento">Vencimento</label>
              <input type="date" id="dataVencimento" required />
            </div>
            <div class="form-group">
              <label for="origemDespesa">Origem</label>
              <select id="origemDespesa"></select>
            </div>
          </div>

          <div class="form-group">
            <label for="obsDespesa">Observações</label>
            <textarea id="obsDespesa" rows="3"></textarea>
          </div>
        </form>
      </div>

      <div class="modal-inclusao-footer">
        <button
          type="button"
          class="btn-secondary"
          onclick="fecharModalInclusao()"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn-primary"
          onclick="salvarDespesa()"
        >
          Salvar
        </button>
      </div>
    </div>
  </div>

  <!-- Modal seleção de envio -->
  <div id="modalSelecionarEnvio" class="modal-envio" style="display:none;">
    <div class="modal-envio-backdrop" onclick="fecharModalSelecionarEnvio()"></div>
    <div class="modal-envio-panel">
      <header class="modal-envio-header">
        <h2>Enviar lembretes</h2>
        <button
          type="button"
          class="modal-envio-close"
          onclick="fecharModalSelecionarEnvio()"
        >
          ×
        </button>
      </header>

      <div class="modal-envio-body">
        <div class="form-group">
          <label>Destinatários</label>
          <div id="listaContatosEnvio"></div>
        </div>
        <div class="form-group">
          <label>Mensagem</label>
          <textarea id="mensagemEnvio" rows="4"></textarea>
        </div>
      </div>

      <div class="modal-envio-footer">
        <button
          type="button"
          class="btn-secondary"
          onclick="fecharModalSelecionarEnvio()"
        >
          Cancelar
        </button>
        <button
          type="button"
          class="btn-primary"
          onclick="confirmarEnvioLembretes()"
        >
          Enviar
        </button>
      </div>
    </div>
  </div>

  <!-- Modal gerenciador de contatos -->
  <div id="modalContatos" class="modal-contatos" style="display:none;">
    <div class="modal-contatos-backdrop" onclick="fecharGerenciadorContatos()"></div>
    <div class="modal-contatos-panel">
      <header class="modal-contatos-header">
        <h2>Contatos</h2>
        <button
          type="button"
          class="modal-contatos-close"
          onclick="fecharGerenciadorContatos()"
        >
          ×
        </button>
      </header>

      <div class="modal-contatos-body">
        <div id="listaContatos"></div>
        <button
          type="button"
          class="btn-primary"
          onclick="adicionarContato()"
        >
          Novo contato
        </button>
      </div>
    </div>
  </div>
</body>
</html>
