<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../assets/imagem/favicon.png" type="image/png" />
  <link rel="stylesheet" href="../assets/css/menu.css" />
  <script src="../assets/js/global.js" defer></script>

  <script defer>

      },
      lithoplant: {
        nome: "Lithoplant",

        hubBadges: ["DualForce", "Carteira", "Vendedores", "Estoque"],
        hubDescricao: "Escolha abaixo qual painel deseja abrir. Cada card abre um dashboard em tela cheia."
      }
    };

    const DASHBOARDS = [
  {

    descricaoCurta: "Vendas, carteira, metas e indicadores de performance.",
    descricaoLonga: "Visão principal por consultor, linha, região e margem.",
    iconEmoji: "📊",
    url: "dashboards/linhagro/atividades.html",
    frequencia: "Atualização: a cada 30 minutos"
  },
{
  id: "linha-gamificacao",
  empresa: "linhagro",
  titulo: "Gamificação - A2W",
  descricaoCurta: "Pontuação dos vendedores por período.",
  descricaoLonga: "Avaliação de performance por dias sem rota, atividades ruins e pendentes, com classificação por vendedor.",
  iconEmoji: "🏅",
  url: "dashboards/linhagro/gamificacao.html",
  frequencia: "Atualização: a cada 30 minutos"
},
  {
    id: "linha-financeiro",
    empresa: "linhagro",
    titulo: "Financeiro – Linhagro",
    descricaoCurta: "Receitas, despesas, DRE e fluxo de caixa.",
    descricaoLonga: "Painel financeiro com visão por centro de custo, período e indicador de resultado.",
    iconEmoji: "💰",
    url: "dashboards/linhagro/financeiro.html",
    frequencia: "Atualização: diária"
  },
  {
    id: "linha-estoque",
    empresa: "linhagro",
    titulo: "Estoque – Linhagro",
    descricaoCurta: "Saldo, giro, cobertura e alertas de ruptura.",
    descricaoLonga: "Painel de estoque consolidado por produto, família e região.",
    iconEmoji: "📦",
    url: "dashboards/linhagro/estoque.html",
    frequencia: "Atualização: diária"
  },
  {
    id: "linha-powerbi-geral",
    empresa: "linhagro",
    titulo: "Power BI – Linhagro (Geral)",
    descricaoCurta: "Visão consolidada dos indicadores da Linhagro.",
    descricaoLonga: "Dashboard geral com visão integrada de indicadores financeiros, comerciais e operacionais.",
    iconEmoji: "📈",
    url: "dashboards/linhagro/powerbi-linhagro.html",
    frequencia: "Atualização: a cada 30 minutos"
  },
  {
    id: "litho-dualforce",
    empresa: "lithoplant",
    titulo: "DualForce Lithoplant",
    descricaoCurta: "Projeto DualForce – visão consolidada.",
    descricaoLonga: "Dashboard principal com vendas, carteira, metas e indicadores operacionais.",
    iconEmoji: "📊",
    url: "dashboards/lithoplant/dualforce.html",
    frequencia: "Atualização: a cada 30 minutos"
  },
  {
    id: "litho-estoque",
    empresa: "lithoplant",
    titulo: "Estoque – Lithoplant",
    descricaoCurta: "Visão industrial de estoque e insumos.",
    descricaoLonga: "Análises de nível de estoque, consumo e reposição da unidade.",
    iconEmoji: "📦",
    url: "dashboards/lithoplant/estoque.html",
    frequencia: "Atualização: diária"
  },
  {
    id: "litho-gracielli",
    empresa: "lithoplant",
    titulo: "Dashboard VIP – Gracielli",
    descricaoCurta: "Painel individual para acompanhamento estratégico.",
    descricaoLonga: "Visão dedicada de indicadores selecionados para a gestão da Gracielli na Lithoplant.",
    iconEmoji: "⭐",
    url: "dashboards/lithoplant/vip-gracielli.html",
    frequencia: "Atualização: a cada 30 minutos"
  },
  {
    id: "litho-joao-paulo",
    empresa: "lithoplant",
    titulo: "Dashboard VIP – João Paulo",
    descricaoCurta: "Painel individual para acompanhamento estratégico.",
    descricaoLonga: "Visão dedicada de indicadores selecionados para o acompanhamento do João Paulo na Lithoplant.",
    iconEmoji: "⭐",
    url: "dashboards/lithoplant/vip-joaopaulo.html",
    frequencia: "Atualização: a cada 30 minutos"
  },
  {
    id: "litho-paulo-modesto",
    empresa: "lithoplant",
    titulo: "Dashboard VIP – Paulo Modesto",
    descricaoCurta: "Painel individual para acompanhamento estratégico.",
    descricaoLonga: "Visão dedicada de indicadores selecionados para o acompanhamento do Paulo Modesto na Lithoplant.",
    iconEmoji: "⭐",
    url: "dashboards/lithoplant/vip-paulomodesto.html",
    frequencia: "Atualização: a cada 30 minutos"
  },
  {
    id: "litho-raphael-brandao",
    empresa: "lithoplant",
    titulo: "Dashboard VIP – Raphael Brandão",
    descricaoCurta: "Painel individual para acompanhamento estratégico.",
    descricaoLonga: "Visão dedicada de indicadores selecionados para o acompanhamento do Raphael Brandão na Lithoplant.",
    iconEmoji: "⭐",
    url: "dashboards/lithoplant/vip-raphaelbrandao.html",
    frequencia: "Atualização: a cada 30 minutos"
  }
    ];

    let dashboardsFiltrados = [];

    function carregarMenu() {
      const user = getUsuarioAtual();
      if (!user) {
        window.location.href = "../index.html";
        return;
      }

      const empresa = window.sessionStorage ? sessionStorage.getItem("empresaSelecionada") : null;
      if (!empresa || !user.empresas || !user.empresas.includes(empresa)) {
        window.location.href = "./select-company.html";
        return;
      }

      const cfg = EMPRESAS_CONFIG[empresa];
      if (!cfg) {
        window.location.href = "../index.html";
        return;
      }

      preencherHeaderUsuario(user, "saudacaoSidebar", "userNameSidebar");

      const hubSubtitle = document.getElementById("hubSubtitle");
      if (hubSubtitle) hubSubtitle.textContent = cfg.hubDescricao;

      const hubBadgesWrap = document.getElementById("hubBadges");
      if (hubBadgesWrap) {
        hubBadgesWrap.innerHTML = "";
        (cfg.hubBadges || []).forEach(txt => {
          const span = document.createElement("span");
          span.className = "badge";
          span.textContent = txt;
          hubBadgesWrap.appendChild(span);
        });
      }

      dashboardsFiltrados = DASHBOARDS.filter(d => d.empresa === empresa);
      atualizarGridDashboards(empresa);

      const app = document.getElementById("app");
      const btnToggle = document.getElementById("btnToggleSidebar");
      if (app && btnToggle) {
        btnToggle.addEventListener("click", () => {
          app.classList.toggle("sidebar-collapsed");
        });
      }
    }

    function atualizarGridDashboards(empresa) {
      const grid = document.getElementById("dashboardGrid");
      if (!grid) return;

      const base = dashboardsFiltrados;
      grid.innerHTML = "";

      base.forEach(d => {
        const card = document.createElement("article");
        card.className = "dash-card";
        card.onclick = () => window.location.href = d.url;

        card.innerHTML = `
          <div class="dash-card-top">
            <div class="dash-card-icon">${d.iconEmoji || "📊"}</div>
            <div class="dash-card-main">
              <p class="dash-card-title">${d.titulo}</p>
              <span class="dash-card-tag">
                ${empresa === "linhagro" ? "Linhagro" : "Lithoplant"}
              </span>
            </div>
          </div>
          <p class="dash-card-text">${d.descricaoCurta || ""}</p>
          <p class="dash-card-text">${d.descricaoLonga || ""}</p>
          <div class="dash-card-footer">
            <span>${d.frequencia || ""}</span>
            <button
              type="button"
              class="btn-open"
              onclick="event.stopPropagation(); window.location.href='${d.url}'"
            >
              Abrir
            </button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function filtrarDashboardsPorTexto(texto) {
      const termo = (texto || "").toLowerCase();
      const empresa = window.sessionStorage ? sessionStorage.getItem("empresaSelecionada") : null;
      if (!empresa) return;

      const base = DASHBOARDS.filter(d => d.empresa === empresa);

      if (!termo) {
        dashboardsFiltrados = [...base];
      } else {
        dashboardsFiltrados = base.filter(d => {
          const t = (d.titulo || "") + " " + (d.descricaoCurta || "") + " " + (d.descricaoLonga || "");
          return t.toLowerCase().includes(termo);
        });
      }

      atualizarGridDashboards(empresa);
    }

    function ativarItemSidebar(chave) {
      document.querySelectorAll(".sidebar-item").forEach(item => {
        item.classList.toggle("sidebar-item-active", item.dataset.key === chave);
      });

      const empresa = window.sessionStorage ? sessionStorage.getItem("empresaSelecionada") : null;
      if (!empresa) return;

      const cfg = EMPRESAS_CONFIG[empresa];

      if (chave === "dashboards") {
        dashboardsFiltrados = DASHBOARDS.filter(d => d.empresa === empresa);
        atualizarGridDashboards(empresa);
      } else if (chave === "calendario") {
        window.location.href = cfg.calendarioPath;
      } else if (chave === "organograma") {
        window.location.href = "./org-linhagro.html";
      }
    }

    function trocarEmpresa() {
      if (window.sessionStorage) {
        sessionStorage.removeItem("empresaSelecionada");
      }
      window.location.href = "./select-company.html";
    }

    function voltarLogin() {
      deslogar();
    }

    window.addEventListener("DOMContentLoaded", carregarMenu);
  </script>
</head>

<body>
  <div class="bg-container">
    <div class="animated-bg"></div>
    <div class="grid-bg"></"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="particles-container"></div>

    <div class="wave-container">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>
  </div>

  <button
    class="sidebar-toggle"
    type="button"
    id="btnToggleSidebar"
    aria-label="Alternar menu lateral"
  >
    <span>☰</span>
  </button>

  <div class="app" id="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">LG</div>
        <div class="sidebar-title-block">
          <span class="sidebar-title" id="saudacaoSidebar">Centro de navegação</span>
          <span class="sidebar-sub" id="userNameSidebar">Dashboards corporativos</span>
        </div>
      </div>

      <div class="sidebar-section">
        <p class="sidebar-section-title">Navegação</p>
        <ul class="sidebar-nav">
          <li class="sidebar-item" data-key="voltar" onclick="trocarEmpresa()">
            <span class="icon">⬅</span>
            <span class="label">Voltar à seleção</span>
          </li>
          <li
            class="sidebar-item sidebar-item-active"
            data-key="dashboards"
            onclick="ativarItemSidebar('dashboards')"
          >
            <span class="icon">📊</span>
            <span class="label">Dashboards</span>
          </li>
          <li class="sidebar-item" data-key="calendario" onclick="ativarItemSidebar('calendario')">
            <span class="icon">📅</span>
            <span class="label">Calendário</span>
          </li>
          <li class="sidebar-item" data-key="organograma" onclick="ativarItemSidebar('organograma')">
            <span class="icon">👥</span>
            <span class="label">Organograma</span>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <button class="Btn sidebar-logout-btn" type="button" onclick="voltarLogin()">
          <div class="sign">
            <svg viewBox="0 0 512 512">
              <path
                d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"
              ></path>
            </svg>
          </div>
          <div class="text">Sair</div>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <span class="main-kicker">Ambientes disponíveis</span>
        <h1 class="main-title">
          Selecione o <span>dashboard</span> que deseja abrir.
        </h1>
        <p class="main-sub" id="hubSubtitle">
          Use a barra lateral para navegar entre áreas e a busca abaixo para filtrar os cartões.
        </p>

        <div class="main-search">
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar dashboards (ex: carteira, logística, estoque)..."
            oninput="filtrarDashboardsPorTexto(this.value)"
          />
          <span class="main-search-icon">🔍</span>
        </div>
      </header>

      <div class="main-badges" id="hubBadges"></div>

      <section class="dashboard-grid" id="dashboardGrid" aria-label="Lista de dashboards">
      </section>
    </main>
  </div>
</body>
</html>
