<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Centro de Navegação - Dashboards</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="../assets/imagem/favicon.png" type="image/png" />
  <link rel="stylesheet" href="../assets/css/menu.css" />
  <script src="../assets/js/global.js" defer></script>

  <script defer>
    const EMPRESAS_CONFIG = {
      linhagro: {
        nome: "Linhagro",
        calendarioPath: "calendario.html",
        hubDescricao:
          "Escolha abaixo qual painel deseja abrir. Cada card abre um dashboard em tela cheia.",
      },
      lithoplant: {
        nome: "Lithoplant",
        calendarioPath: "calendario.html",
        hubBadges: ["DualForce", "Carteira", "Vendedores", "Estoque"],
        hubDescricao:
          "Escolha abaixo qual painel deseja abrir. Cada card abre um dashboard em tela cheia.",
      },
    };

    let DASHBOARDS = [];
    let dashboardsFiltrados = [];

    // ----------------- PERMISSÃO / RBAC NO FRONT -----------------

    function usuarioPodeVerDashboard(user, dash) {
      const email = (user.email || "").toLowerCase();
      const perfis = user.perfis || [];
      const isAdmin = perfis.includes("ADMIN");

      // ADMIN vê tudo da empresa
      if (isAdmin) return true;

      const tiposPermitidos = dash.tiposPermitidos || [];
      const usuariosPermitidos = (dash.usuariosPermitidos || []).map((e) =>
        (e || "").toLowerCase()
      );

      // VIP por e-mail
      if (usuariosPermitidos.length > 0 && !usuariosPermitidos.includes(email)) {
        return false;
      }

      // restrição por perfil
      if (tiposPermitidos.length > 0) {
        const temPerfil = perfis.some((p) => tiposPermitidos.includes(p));
        if (!temPerfil) return false;
      }

      return true;
    }

    // ----------------- CARREGAR DASHBOARDS DA API -----------------

    async function carregarDashboardsDaAPI(empresaApi) {
      // empresaApi = 'LINHAGRO' ou 'LITHOPLANT'
      const data = await apiGet(
        `/dashboards?empresa=${encodeURIComponent(empresaApi)}`
      );
      const lista = data.dashboards || [];

      // Normaliza para o formato usado no front
      DASHBOARDS = lista.map((d) => ({
        id: d.id,
        empresa: (d.empresa || "").toLowerCase(), // 'linhagro' / 'lithoplant'
        titulo: d.titulo,
        descricaoCurta: d.descricaoCurta,
        descricaoLonga: d.descricaoLonga,
        iconEmoji: d.iconEmoji || "📊",
        url: d.url,
        frequencia: d.frequencia,
        ativo: d.ativo === true || d.ativo === 1,
        tiposPermitidos: d.perfisPermitidos || [],
        usuariosPermitidos: d.usuariosPermitidos || [],
      }));
    }

    // ----------------- CARREGAR MENU PRINCIPAL -----------------

    async function carregarMenu() {
      const user = getUsuarioAtual();
      if (!user) {
        window.location.href = "../index.html";
        return;
      }

      const empresa =
        window.sessionStorage && sessionStorage.getItem("empresaSelecionada");
      if (!empresa || !user.empresas || !user.empresas.includes(empresa)) {
        window.location.href = "./select-company.html";
        return;
      }

      const cfg = EMPRESAS_CONFIG[empresa];
      if (!cfg) {
        window.location.href = "../index.html";
        return;
      }

      // Carrega dashboards da API
      const empresaApi = empresa.toUpperCase(); // 'linhagro' -> 'LINHAGRO'
      try {
        await carregarDashboardsDaAPI(empresaApi);
      } catch (e) {
        console.error("Erro ao carregar dashboards da API:", e);
      }

      // saudação no sidebar
      if (typeof preencherHeaderUsuario === "function") {
        preencherHeaderUsuario(user, "saudacaoSidebar", "userNameSidebar");
      } else {
        const saud = document.getElementById("saudacaoSidebar");
        const nome = document.getElementById("userNameSidebar");
        if (saud) saud.textContent = "Centro de navegação";
        if (nome) nome.textContent = user.nome || user.email || "Usuário";
      }

      const hubSubtitle = document.getElementById("hubSubtitle");
      if (hubSubtitle) hubSubtitle.textContent = cfg.hubDescricao;

      const hubBadgesWrap = document.getElementById("hubBadges");
      if (hubBadgesWrap) {
        hubBadgesWrap.innerHTML = "";
        (cfg.hubBadges || []).forEach((txt) => {
          const span = document.createElement("span");
          span.className = "badge";
          span.textContent = txt;
          hubBadgesWrap.appendChild(span);
        });
      }

      // Filtra por empresa + permissão
      dashboardsFiltrados = DASHBOARDS.filter(
        (d) => d.empresa === empresa && usuarioPodeVerDashboard(user, d)
      );
      atualizarGridDashboards(empresa);

      const app = document.getElementById("app");
      const btnToggle = document.getElementById("btnToggleSidebar");
      if (app && btnToggle) {
        btnToggle.addEventListener("click", () => {
          app.classList.toggle("sidebar-collapsed");
        });
      }
    }

    // ----------------- GRID / RENDERIZAÇÃO DOS CARDS -----------------

    function atualizarGridDashboards(empresa) {
      const grid = document.getElementById("dashboardGrid");
      if (!grid) return;

      grid.innerHTML = "";

      dashboardsFiltrados.forEach((d) => {
        const card = document.createElement("article");
        card.className = "dash-card";
        card.onclick = () => (window.location.href = d.url);

        card.innerHTML = `
          <div class="dash-card-top">
            <div class="dash-card-icon">${d.iconEmoji || "📊"}</div>
            <div class="dash-card-main">
              <p class="dash-card-title">${d.titulo}</p>
              <span class="dash-card-tag">
                ${empresa === "linhagro" ? "Linhagro" : "Lithoplant"}
              </span>
            </div>
          </div>
          <p class="dash-card-text">${d.descricaoCurta || ""}</p>
          <p class="dash-card-text">${d.descricaoLonga || ""}</p>
          <div class="dash-card-footer">
            <span>${d.frequencia || ""}</span>
            <button
              type="button"
              class="btn-open"
              onclick="event.stopPropagation(); window.location.href='${d.url}'"
            >
              Abrir
            </button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // ----------------- BUSCA / FILTRO POR TEXTO -----------------

    function filtrarDashboardsPorTexto(texto) {
      const termo = (texto || "").toLowerCase();
      const empresa =
        window.sessionStorage && sessionStorage.getItem("empresaSelecionada");
      if (!empresa) return;

      const user = getUsuarioAtual();
      if (!user) return;

      const baseEmpresa = DASHBOARDS.filter(
        (d) => d.empresa === empresa && usuarioPodeVerDashboard(user, d)
      );

      if (!termo) {
        dashboardsFiltrados = [...baseEmpresa];
      } else {
        dashboardsFiltrados = baseEmpresa.filter((d) => {
          const t =
            (d.titulo || "") +
            " " +
            (d.descricaoCurta || "") +
            " " +
            (d.descricaoLonga || "");
          return t.toLowerCase().includes(termo);
        });
      }

      atualizarGridDashboards(empresa);
    }

    // ----------------- SIDEBAR / NAVEGAÇÃO LATERAL -----------------

    function ativarItemSidebar(chave) {
      document.querySelectorAll(".sidebar-item").forEach((item) => {
        item.classList.toggle(
          "sidebar-item-active",
          item.dataset.key === chave
        );
      });

      const empresa =
        window.sessionStorage && sessionStorage.getItem("empresaSelecionada");
      if (!empresa) return;

      const cfg = EMPRESAS_CONFIG[empresa];

      if (chave === "dashboards") {
        const user = getUsuarioAtual();
        if (!user) return;
        dashboardsFiltrados = DASHBOARDS.filter(
          (d) => d.empresa === empresa && usuarioPodeVerDashboard(user, d)
        );
        atualizarGridDashboards(empresa);
      } else if (chave === "calendario") {
        window.location.href = cfg.calendarioPath;
      } else if (chave === "organograma") {
        if (empresa === "linhagro") {
          window.location.href = "./org-linhagro.html";
        } else if (empresa === "lithoplant") {
          window.location.href = "./org-lithoplant.html";
        }
      }
    }

    // ----------------- TROCAR EMPRESA / LOGOUT -----------------

    function trocarEmpresa() {
      if (window.sessionStorage) {
        sessionStorage.removeItem("empresaSelecionada");
      }
      window.location.href = "./select-company.html";
    }

    function voltarLogin() {
      deslogar();
    }

    // ----------------- INICIALIZAÇÃO -----------------

    window.addEventListener("DOMContentLoaded", carregarMenu);

    // Deixa as funções globais que o HTML usa
    window.filtrarDashboardsPorTexto = filtrarDashboardsPorTexto;
    window.ativarItemSidebar = ativarItemSidebar;
    window.trocarEmpresa = trocarEmpresa;
    window.voltarLogin = voltarLogin;
  </script>
</head>

<body>
  <div class="bg-container">
    <div class="animated-bg"></div>
    <div class="grid-bg"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="particles-container"></div>

    <div class="wave-container">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>
  </div>

  <button
    class="sidebar-toggle"
    type="button"
    id="btnToggleSidebar"
    aria-label="Alternar menu lateral"
  >
    <span>☰</span>
  </button>

  <div class="app" id="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">LG</div>
        <div class="sidebar-title-block">
          <span class="sidebar-title" id="saudacaoSidebar">Centro de navegação</span>
          <span class="sidebar-sub" id="userNameSidebar">Dashboards corporativos</span>
        </div>
      </div>

      <div class="sidebar-section">
        <p class="sidebar-section-title">Navegação</p>
        <ul class="sidebar-nav">
          <li class="sidebar-item" data-key="voltar" onclick="trocarEmpresa()">
            <span class="icon">⬅</span>
            <span class="label">Voltar à seleção</span>
          </li>
          <li
            class="sidebar-item sidebar-item-active"
            data-key="dashboards"
            onclick="ativarItemSidebar('dashboards')"
          >
            <span class="icon">📊</span>
            <span class="label">Dashboards</span>
          </li>
          <li class="sidebar-item" data-key="calendario" onclick="ativarItemSidebar('calendario')">
            <span class="icon">📅</span>
            <span class="label">Calendário</span>
          </li>
          <li class="sidebar-item" data-key="organograma" onclick="ativarItemSidebar('organograma')">
            <span class="icon">👥</span>
            <span class="label">Organograma</span>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <button class="Btn sidebar-logout-btn" type="button" onclick="voltarLogin()">
          <div class="sign">
            <svg viewBox="0 0 512 512">
              <path
                d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"
              ></path>
            </svg>
          </div>
          <div class="text">Sair</div>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <span class="main-kicker">Ambientes disponíveis</span>
        <h1 class="main-title">
          Selecione o <span>dashboard</span> que deseja abrir.
        </h1>
        <p class="main-sub" id="hubSubtitle">
          Use a barra lateral para navegar entre áreas e a busca abaixo para filtrar os cartões.
        </p>

        <div class="main-search">
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar dashboards (ex: carteira, logística, estoque)..."
            oninput="filtrarDashboardsPorTexto(this.value)"
          />
          <span class="main-search-icon">🔍</span>
        </div>
      </header>

      <div class="main-badges" id="hubBadges"></div>

      <section
        class="dashboard-grid"
        id="dashboardGrid"
        aria-label="Lista de dashboards"
      ></section>
    </main>
  </div>
</body>
</html>
