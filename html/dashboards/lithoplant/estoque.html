<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Dashboard – Estoque</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" href="../../assets/imagem/favicon.png" type="image/png" />

  <style>
    :root {
      --sidebar-width: 260px;
      --sidebar-width-collapsed: 80px;

      --primary: #0f766e;
      --accent: #10b981;
      --accent2: #5eead4;

      --border-soft: #0f172a;
      --text-main: #e5fdf7;
      --text-soft: #9ca3af;

      --radius-lg: 18px;
      --transition-fast: 0.22s ease;

      --bar-extra: 75px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      min-height: 100vh;
      background: #020617;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text-main);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(16, 185, 129, 0.16) 0%, transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(45, 212, 191, 0.12) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(8, 47, 73, 0.9) 0%, #020617 55%);
      z-index: 0;
      pointer-events: none;
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      transition: grid-template-columns var(--transition-fast);
    }

    .app.sidebar-collapsed {
      grid-template-columns: var(--sidebar-width-collapsed) minmax(0, 1fr);
    }

    .sidebar {
      background: radial-gradient(circle at top, rgba(15, 23, 42, 0.96), #020617);
      border-right: 1px solid var(--border-soft);
      padding: 1.1rem 0.9rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      position: relative;
      z-index: 10;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.9);
      transition: padding var(--transition-fast);
      overflow: hidden;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding-inline: 0.2rem;
    }

    .sidebar-logo {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 0, #22c55e, #022c22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #ecfdf5;
      flex-shrink: 0;
      box-shadow:
        0 0 0 1px #022c22,
        0 0 22px rgba(34, 197, 94, 0.9);
      overflow: hidden;
    }

    .sidebar-logo img {
      width: 24px;
      height: 24px;
      border-radius: 999px;
    }

    .sidebar-title-block {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      transition: opacity var(--transition-fast);
    }

    .sidebar-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e5fdf7;
    }

    .sidebar-sub {
      font-size: 0.78rem;
      color: #6ee7b7;
    }

    .sidebar-section {
      padding-inline: 0.2rem;
    }

    .sidebar-section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #6b7280;
      margin-bottom: 0.35rem;
      white-space: nowrap;
      transition: opacity var(--transition-fast);
    }

    .sidebar-nav {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.45rem 0.6rem;
      border-radius: 999px;
      font-size: 0.84rem;
      color: var(--text-soft);
      border: 1px solid #0f172a;
      background: rgba(15, 23, 42, 0.96);
      cursor: pointer;
      transition:
        background var(--transition-fast),
        border-color var(--transition-fast),
        color var(--transition-fast),
        transform 0.16s ease,
        box-shadow 0.16s ease;
      white-space: nowrap;
      overflow: hidden;
    }

    .sidebar-item span.icon {
      font-size: 1rem;
      flex-shrink: 0;
    }

    .sidebar-item span.label {
      display: inline;
    }

    .sidebar-item-active {
      border-color: var(--accent);
      color: #ecfdf5;
      background: radial-gradient(circle at 0 0, rgba(16, 185, 129, 0.5), #020617);
      box-shadow: 0 14px 30px rgba(16, 185, 129, 0.5);
    }

    .sidebar-item:not(.sidebar-item-active):hover {
      border-color: var(--primary);
      background: #020617;
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(0, 0, 0, 0.9);
      color: #e5fdf7;
    }

    .sidebar-footer {
      margin-top: auto;
      padding-inline: 0.2rem;
      display: flex;
      justify-content: center;
    }

    .app.sidebar-collapsed .sidebar {
      padding-inline: 0.4rem;
    }

    .app.sidebar-collapsed .sidebar-title-block,
    .app.sidebar-collapsed .sidebar-section-title {
      opacity: 0;
      pointer-events: none;
    }

    .app.sidebar-collapsed .sidebar-item span.label {
      display: none;
    }

    .app.sidebar-collapsed .sidebar-item {
      justify-content: center;
      padding-inline: 0;
    }

    .app.sidebar-collapsed .sidebar-logo {
      display: none;
    }

    .sidebar-toggle {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 50;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(45, 212, 191, 0.6);
      background: rgba(15, 23, 42, 0.96);
      color: #e5fdf7;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition:
        background var(--transition-fast),
        border-color var(--transition-fast),
        transform 0.16s ease,
        box-shadow 0.16s ease;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.9);
    }

    .sidebar-toggle:hover {
      background: #020617;
      border-color: #22c55e;
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.9);
    }

    .sidebar-toggle span {
      font-size: 1.1rem;
      transition: transform 0.18s ease;
    }

    .app.sidebar-collapsed .sidebar-toggle span {
      transform: rotate(180deg);
    }

    .main {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      min-width: 0;
      z-index: 1;
    }

    .dash-header {
      padding: 1.1rem 1.4rem 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .dash-kicker {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #6b7280;
    }

    .dash-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .dash-title span {
      background: linear-gradient(135deg, #22c55e, #5eead4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .dash-sub {
      margin: 0;
      font-size: 0.82rem;
      color: var(--text-soft);
      max-width: 40rem;
    }

    .dash-frame-wrapper {
      position: relative;
      flex: 1;
      margin: 0.7rem 1.4rem 1.4rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-soft);
      background: #000;
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.9),
        0 0 0 1px rgba(15, 23, 42, 0.9);
      overflow: hidden;
    }

    .dash-frame-wrapper iframe {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: calc(-1 * var(--bar-extra));
      height: calc(100% + var(--bar-extra));
      width: 100%;
      border: 0;
      display: block;
    }

    .Btn {
      --black: #000000;
      --ch-black: #141414;
      --eer-black: #1b1b1b;
      --night-rider: #e5fdf7;
      --white: #ffffff;
      --af-white: #020617;
      --ch-white: #0b1120;

      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition-duration: .3s;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.75);
      background: radial-gradient(circle at top left, rgba(34, 197, 94, 0.3), #020617);
      border: 1px solid rgba(34, 197, 94, 0.7);
    }

    .Btn .sign {
      width: 100%;
      transition-duration: .3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .Btn .sign svg {
      width: 18px;
    }

    .Btn .sign svg path {
      fill: #bbf7d0;
    }

    .Btn .text {
      position: absolute;
      right: 0%;
      width: 0%;
      opacity: 0;
      color: #e5fdf7;
      font-size: 0.82rem;
      font-weight: 600;
      transition-duration: .3s;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .Btn:hover {
      width: 120px;
      border-radius: 999px;
      background: radial-gradient(circle at top left, rgba(34, 197, 94, 0.45), #020617);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.9);
    }

    .Btn:hover .sign {
      width: 30%;
      padding-left: 14px;
    }

    .Btn:hover .text {
      opacity: 1;
      width: 70%;
      padding-right: 10px;
    }

    .Btn:active {
      transform: translate(2px, 2px);
    }

    @media (max-width: 960px) {
      .dash-header {
        padding: 1.1rem 1rem 0.6rem;
      }

      .dash-frame-wrapper {
        margin: 0.7rem 1rem 1.2rem;
      }
    }

    @media (max-width: 640px) {
      .app {
        grid-template-columns: var(--sidebar-width-collapsed) minmax(0, 1fr);
      }
    }
  </style>
</head>
<body onload="validarAcessoDashboardEmpresa && validarAcessoDashboardEmpresa('estoque')">
  <button
    class="sidebar-toggle"
    type="button"
    id="btnToggleSidebar"
    aria-label="Alternar menu lateral"
  >
    <span>☰</span>
  </button>

  <div class="app" id="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <img
            src="../../assets/imagem/logolinhagro.png"
            alt="Dashboard – Estoque"
          />
        </div>
        <div class="sidebar-title-block">
          <span class="sidebar-title">Dashboard de Estoque</span>
          <span class="sidebar-sub">Controle de produtos</span>
        </div>
      </div>

      <div class="sidebar-section">
        <p class="sidebar-section-title">Navegação</p>
        <ul class="sidebar-nav">
          <li
            class="sidebar-item"
            data-key="menu"
            onclick="window.location.href='../../menu.html'"
          >
            <span class="icon">🏠</span>
            <span class="label">Voltar ao menu</span>
          </li>

          <li
            class="sidebar-item"
            data-key="dashboards"
            onclick="window.location.href='../../menu.html'"
          >
            <span class="icon">📊</span>
            <span class="label">Dashboards</span>
          </li>

          <li
            class="sidebar-item sidebar-item-active"
            data-key="estoque"
          >
            <span class="icon">📦</span>
            <span class="label">Estoque</span>
          </li>

          <li
            class="sidebar-item"
            data-key="calendario"
            onclick="window.location.href='../../calendario.html'"
          >
            <span class="icon">📅</span>
            <span class="label">Calendário</span>
          </li>

          <li
            class="sidebar-item"
            data-key="organograma"
            onclick="window.location.href='../../org-linhagro.html'"
          >
            <span class="icon">👥</span>
            <span class="label">Organograma</span>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <button class="Btn" type="button" onclick="deslogar && deslogar()">
          <div class="sign">
            <svg viewBox="0 0 512 512">
              <path d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z"></path>
            </svg>
          </div>
          <div class="text">Sair</div>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="dash-header">
        <span class="dash-kicker">Gestão de estoque</span>
        <h1 class="dash-title">
          Dashboard <span>Estoque</span>
        </h1>
        <p class="dash-sub">
          Acompanhamento de níveis de estoque, giros, reposição e rupturas em tempo real.
        </p>
      </header>

      <section class="dash-frame-wrapper">
        <iframe
          id="frameDash"
          title="Dashboard – Estoque"
          src="https://app.powerbi.com/view?r=SUA_URL_DO_POWERBI_AQUI"
          allowfullscreen="true">
        </iframe>
      </section>
    </main>
  </div>

  <script src="../../assets/js/global.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const app = document.getElementById("app");
      const btnToggle = document.getElementById("btnToggleSidebar");
      if (app && btnToggle) {
        btnToggle.addEventListener("click", () => {
          app.classList.toggle("sidebar-collapsed");
        });
      }
    });

    function toggleFullScreen() {
      const iframe = document.getElementById('frameDash');
      if (!iframe) return;

      const isFull =
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement;

      if (!isFull) {
        if (iframe.requestFullscreen) iframe.requestFullscreen();
        else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
        else if (iframe.mozRequestFullScreen) iframe.mozRequestFullScreen();
        else if (iframe.msRequestFullscreen) iframe.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }
    }
  </script>
</body>
</html>
