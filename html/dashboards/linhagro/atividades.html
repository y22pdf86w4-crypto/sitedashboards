<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Power BI – Linhagro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon -->
  <link rel="icon" href="../../assets/imagem/favicon.png" type="image/png" />

  <style>
    :root { --bar-extra: 60px; }

    html, body {
      height: 100%;
      margin: 0;
      background: #020617;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:#000;
    }

    .wrap iframe {
      position: absolute;
      left: 0; right: 0; top: 0;
      bottom: calc(-1 * var(--bar-extra));
      height: calc(100% + var(--bar-extra));
      width: 100%;
      border: 0;
      display: block;
    }

    /* Barra superior com botão voltar e fullscreen */
    .top-bar {
      position: fixed;
      top: 10px;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      pointer-events: none;
    }

    .top-bar > * {
      pointer-events: auto;
    }

    .btn-chip {
      border: 1px solid rgba(148, 163, 184, 0.7);
      border-radius: 999px;
      background: radial-gradient(circle at 0 0,
        rgba(34, 197, 94, 0.12) 0,
        rgba(15, 23, 42, 0.98) 55%,
        #020617 100%);
      color: #e5e7eb;
      font-size: 0.75rem;
      padding: 0.4rem 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.7),
        0 0 0 1px rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn-chip span.icon {
      font-size: 0.9rem;
    }

    .btn-chip:hover {
      border-color: rgba(34, 197, 94, 0.9);
      box-shadow:
        0 12px 30px rgba(34, 197, 94, 0.4),
        0 0 0 1px rgba(15, 23, 42, 1);
    }

    @media (max-width: 768px) {
      .wrap {
        position: relative;
        height: 100vh;
        inset: 0;
        overflow: hidden;
      }

      .wrap iframe {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        height: 100%;
      }

      .top-bar {
        top: 8px;
      }

      .btn-chip {
        font-size: 0.7rem;
        padding: 0.35rem 0.7rem;
      }
    }
  </style>
</head>
<body onload="validarAcessoDashboardEmpresa('linhagro')">
  <!-- Barra superior -->
  <div class="top-bar">
    <!-- Botão voltar ao menu -->
    <button
      type="button"
      class="btn-chip"
      onclick="window.location.href='../../menu.html'"
      title="Voltar ao menu"
    >
      <span class="icon">🏠</span>
      <span>Voltar ao menu</span>
    </button>

    <!-- Botão tela cheia -->
    <button
      type="button"
      class="btn-chip"
      onclick="toggleFullScreen()"
      id="btnFullscreen"
      title="Abrir em tela cheia"
    >
      <span class="icon">⛶</span>
      <span id="txtFullscreen">Tela cheia</span>
    </button>
  </div>

  <div class="wrap">
    <iframe
      id="frameDash"
      title="_DASH LINHAGRO"
      src="https://app.powerbi.com/view?r=eyJrIjoiYzc3ODM0N2UtNmFlZi00NjU3LTg0ODItN2I3Nzc5YjM1NjkwIiwidCI6IjhhZWI1NjZjLTZlNGQtNDJiZi04MTA5LWY5OWExYjBkNGQyNCJ9&pageName=30b3eb14f6604bf7e406"
      allowfullscreen="true">
    </iframe>
  </div>

  <script src="../../assets/js/global.js"></script>
  <script>
    function toggleFullScreen() {
      const iframe = document.getElementById('frameDash');
      const btnTxt = document.getElementById('txtFullscreen');
      if (!iframe) return;

      const isFull =
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement;

      if (!isFull) {
        if (iframe.requestFullscreen) {
          iframe.requestFullscreen();
        } else if (iframe.webkitRequestFullscreen) {
          iframe.webkitRequestFullscreen();
        } else if (iframe.mozRequestFullScreen) {
          iframe.mozRequestFullScreen();
        } else if (iframe.msRequestFullscreen) {
          iframe.msRequestFullscreen();
        }
        if (btnTxt) btnTxt.textContent = 'Sair tela cheia';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.mozCancelFullScreen) {
          document.mozCancelFullScreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
        if (btnTxt) btnTxt.textContent = 'Tela cheia';
      }
    }
  </script>
</body>
</html>
