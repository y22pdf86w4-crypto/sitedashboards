<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Selecione a empresa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon -->
  <link rel="icon" href="../assets/imagem/favicon.png" type="image/png" />

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/background.css" />
  <link rel="stylesheet" href="../assets/css/select-company.css" />

  <!-- JS global -->
  <script src="../assets/js/global.js" defer></script>

  <script defer>
    function carregarSelecaoEmpresa() {
      // garante usuário logado
      const user = getUsuarioAtual();
      if (!user) {
        window.location.href = "../index.html";
        return;
      }

      const empresasUser = user.empresas || [];

      // se só tiver 1 empresa, já salva e vai direto para o menu único
      if (empresasUser.length === 1) {
        selecionarEmpresa(empresasUser[0]);
        return;
      }

      // mostra/esconde cards conforme permissão
      const cardLinhagro = document.querySelector('[data-empresa="linhagro"]');
      const cardLitho    = document.querySelector('[data-empresa="lithoplant"]');

      if (cardLinhagro && !empresasUser.includes("linhagro")) {
        cardLinhagro.style.display = "none";
      }
      if (cardLitho && !empresasUser.includes("lithoplant")) {
        cardLitho.style.display = "none";
      }
    }

    function selecionarEmpresa(empresa) {
      if (window.sessionStorage) {
        sessionStorage.setItem("empresaSelecionada", empresa);
      }
      window.location.href = "./menu.html";
    }

    function voltarLogin() {
      if (window.sessionStorage) {
        sessionStorage.removeItem("empresaSelecionada");
      }
      window.location.href = "../index.html";
    }
  </script>
</head>
<body class="select-company-page" onload="carregarSelecaoEmpresa()">
  <!-- Fundo padrão -->
  <div class="bg-container" aria-hidden="true">
    <div class="animated-bg"></div>
    <div class="particles-container"></div>
    <div class="wave-container">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="grid-bg"></div>
  </div>

  <!-- HEADER -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="header-logo-pill">
          <div class="header-logo">
            <img src="../assets/imagem/logolinhagro.png" alt="Linhagro & Lithoplant" />
          </div>
          <div class="header-text">
            <p class="header-title">Selecione a empresa</p>
            <p class="header-subtitle">
              Escolha o ambiente que deseja acessar.
            </p>
          </div>
        </div>
      </div>

      <div class="header-right">
        <!-- Botão Logística no cabeçalho -->
        <button
          type="button"
          class="btn-access"
          onclick="window.location.href='./logistica.html'"
        >
          <span>Logística</span>
          <span class="btn-access-glow"></span>
        </button>

        <!-- Botão Sair -->
        <button
          type="button"
          class="btn-exit"
          title="Voltar para login"
          onclick="voltarLogin()"
        >
          <span class="btn-exit-icon">⟵</span>
          <span class="btn-exit-text">Sair</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO -->
  <main class="page-main">
    <section class="company-shell" aria-label="Seleção de empresas">
      <header class="company-shell-header">
        <h1 class="company-shell-title">
          Selecione a <span class="gradient-text">empresa</span>
        </h1>
        <p class="company-shell-subtitle">
          Escolha abaixo qual estrutura de dashboards deseja visualizar.
        </p>
      </header>

      <div class="company-row">
        <!-- Linhagro -->
        <article
          class="company-card company-card--animated"
          data-empresa="linhagro"
          tabindex="0"
          role="button"
          aria-label="Acessar dashboards da empresa Linhagro"
          onclick="selecionarEmpresa('linhagro')"
          onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selecionarEmpresa('linhagro'); }"
        >
          <div class="company-card-logo-wrap">
            <img src="../assets/imagem/logolinhagro.png" alt="Linhagro" />
          </div>
          <div class="company-card-name">Linhagro</div>
          <p class="company-card-meta">
            Matriz e filiais – dashboards comerciais e operacionais.
          </p>
          <button
            type="button"
            class="btn-access"
            onclick="event.stopPropagation(); selecionarEmpresa('linhagro');"
          >
            <span>Acessar</span>
            <span class="btn-access-glow"></span>
          </button>
        </article>

        <!-- Lithoplant -->
        <article
          class="company-card company-card--animated"
          data-empresa="lithoplant"
          tabindex="0"
          role="button"
          aria-label="Acessar dashboards da empresa Lithoplant"
          onclick="selecionarEmpresa('lithoplant')"
          onkeydown="if(event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selecionarEmpresa('lithoplant'); }"
        >
          <div class="company-card-logo-wrap">
            <img src="../assets/imagem/logolitho.png" alt="Lithoplant" />
          </div>
          <div class="company-card-name">Lithoplant</div>
          <p class="company-card-meta">
            Indicadores específicos da unidade Lithoplant.
          </p>
          <button
            type="button"
            class="btn-access"
            onclick="event.stopPropagation(); selecionarEmpresa('lithoplant');"
          >
            <span>Acessar</span>
            <span class="btn-access-glow"></span>
          </button>
        </article>
      </div>

      <div class="company-shell-footer">
        <button
          type="button"
          class="btn-access"
          onclick="voltarLogin()"
        >
          <span>Voltar para login</span>
          <span class="btn-access-glow"></span>
        </button>
      </div>
    </section>
  </main>
</body>
</html>
