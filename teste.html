<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Teste – Filtros Horizontais</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    :root {
      --primary: #0f766e;
      --accent: #10b981;
      --border-soft: #1f2933;
      --bg-dark: #020617;
      --bg-card: #020617;
      --bg-field: #020617;
      --text-main: #e5fdf7;
      --text-soft: #9ca3af;
      --radius-lg: 16px;
      --transition-fast: 0.22s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0, #022c22, #020617 55%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      color: var(--text-main);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .page {
      width: 100%;
      max-width: 1200px;
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
    }

    .page-sub {
      font-size: 0.85rem;
      color: var(--text-soft);
      margin-bottom: 1rem;
    }

    /* CONTAINER DOS FILTROS */

    .filters-shell {
      padding: 0.8rem 1rem;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(15, 23, 42, 0.9);
      background: radial-gradient(circle at top left, rgba(15, 118, 110, 0.4), var(--bg-card));
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .filters-shell-header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.8rem;
      align-items: baseline;
      justify-content: space-between;
    }

    .filters-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #9ca3af;
    }

    .filters-subtitle {
      font-size: 0.78rem;
      color: #6b7280;
    }

    /* LINHA HORIZONTAL DOS GRUPOS */

    .filters-row {
      display: flex;
      flex-wrap: wrap;      /* quebra se faltar espaço */
      gap: 0.6rem;
      align-items: stretch;
    }

    /* Cada grupo é um “chip comprido” na horizontal */

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.45rem 0.7rem;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(55, 65, 81, 0.85);
      color: #e5e7eb;
      font-size: 0.8rem;
      flex: 0 1 auto;       /* largura conforme conteúdo, sem crescer demais */
      white-space: nowrap;  /* campos ficam mais compactos na horizontal */
    }

    .filter-group-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #9ca3af;
    }

    .filter-fields {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .filter-field {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .filter-field label {
      font-size: 0.65rem;
      color: #9ca3af;
    }

    .filter-field input,
    .filter-field select {
      background: var(--bg-field);
      border-radius: 999px;
      border: 1px solid rgba(55, 65, 81, 0.9);
      padding: 0.3rem 0.7rem;
      color: #e5e7eb;
      font-size: 0.78rem;
      outline: none;
      min-width: 130px;
    }

    .filter-field input::placeholder {
      color: #6b7280;
    }

    .filter-field input:focus,
    .filter-field select:focus {
      border-color: #22c55e;
      box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.3);
    }

    /* AÇÕES – também na mesma linha dos filtros */

    .filters-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-left: auto; /* empurra para a direita da linha */
      flex: 0 0 auto;
    }

    .btn-refresh,
    .btn-clear {
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.8);
      background: radial-gradient(circle at top left, rgba(16, 185, 129, 0.45), #022c22);
      color: #ecfdf5;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      box-shadow: 0 10px 22px rgba(16, 185, 129, 0.5);
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .btn-clear {
      border-color: rgba(148, 163, 184, 0.9);
      background: rgba(15, 23, 42, 0.96);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.9);
    }

    .btn-refresh span.icon,
    .btn-clear span.icon {
      font-size: 0.9rem;
    }

    .btn-refresh:hover,
    .btn-clear:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(16, 185, 129, 0.85);
    }

    /* Responsivo: em telas bem pequenas, quebra em 2 linhas de forma agradável */

    @media (max-width: 900px) {
      .filters-row {
        row-gap: 0.5rem;
      }
      .filter-group {
        white-space: normal; /* permite quebrar label/inputs */
      }
    }

    @media (max-width: 600px) {
      .filters-row {
        flex-direction: column;
        align-items: stretch;
      }
      .filters-actions {
        margin-left: 0;
        justify-content: flex-start;
      }
      .filter-group {
        width: 100%;
      }
      .filter-field input,
      .filter-field select {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1 class="page-title">Teste – Filtros lado a lado</h1>
    <p class="page-sub">
      Todos os grupos em uma única linha, quebrando só quando faltar espaço.
    </p>

    <section class="filters-shell">
      <div class="filters-shell-header">
        <span class="filters-title">Filtros</span>
        <span class="filters-subtitle">
          Data, região, vendedor e cliente alinhados horizontalmente
        </span>
      </div>

      <div class="filters-row">
        <!-- Data -->
        <div class="filter-group">
          <span class="filter-group-label">Data</span>
          <div class="filter-fields">
            <div class="filter-field">
              <label for="fAno">Ano</label>
              <input
                id="fAno"
                type="number"
                min="2000"
                step="1"
                placeholder="2026"
              />
            </div>

            <div class="filter-field">
              <label for="fMes">Mês</label>
              <select id="fMes">
                <option value="">Todos</option>
                <option value="01">Jan</option>
                <option value="02">Fev</option>
                <option value="03">Mar</option>
                <option value="04">Abr</option>
                <option value="05">Mai</option>
                <option value="06">Jun</option>
                <option value="07">Jul</option>
                <option value="08">Ago</option>
                <option value="09">Set</option>
                <option value="10">Out</option>
                <option value="11">Nov</option>
                <option value="12">Dez</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Região -->
        <div class="filter-group">
          <span class="filter-group-label">Região</span>
          <div class="filter-fields">
            <div class="filter-field">
              <label for="fRegiao">Região</label>
              <select id="fRegiao">
                <option value="">Todas</option>
                <option value="1">1 - Grande Vitória</option>
                <option value="2">2 - Norte / Litoral ES + BA</option>
                <option value="3">3 - Noroeste ES</option>
                <option value="4">4 - Sul ES / Caparaó</option>
                <option value="5">5 - Centro Serrana ES</option>
                <option value="6">6 - Minas Gerais</option>
                <option value="7">7 - São Paulo / Interior</option>
                <option value="8">8 - Rio de Janeiro</option>
                <option value="9">9 - Nordeste</option>
                <option value="10">10 - Centro-Oeste / Sul</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Vendedor -->
        <div class="filter-group">
          <span class="filter-group-label">Vendedor</span>
          <div class="filter-fields">
            <div class="filter-field">
              <label for="fVendedor">Código</label>
              <input
                id="fVendedor"
                type="number"
                min="0"
                step="1"
                placeholder="ex: 163"
              />
            </div>

            <div class="filter-field">
              <label for="fVendedorNome">Nome</label>
              <input
                id="fVendedorNome"
                type="text"
                placeholder="parte do nome"
              />
            </div>
          </div>
        </div>

        <!-- Cliente -->
        <div class="filter-group">
          <span class="filter-group-label">Cliente</span>
          <div class="filter-fields">
            <div class="filter-field">
              <label for="fCliente">Código</label>
              <input
                id="fCliente"
                type="number"
                min="0"
                step="1"
                placeholder="CODPARC"
              />
            </div>

            <div class="filter-field">
              <label for="fClienteNome">Nome</label>
              <input
                id="fClienteNome"
                type="text"
                placeholder="digite o nome"
              />
            </div>
          </div>
        </div>

        <!-- Ações -->
        <div class="filters-actions">
          <button class="btn-refresh" type="button" id="btnAplicar">
            <span class="icon">↻</span>
            <span>Aplicar</span>
          </button>

          <button class="btn-clear" type="button" id="btnLimpar">
            <span class="icon">✕</span>
            <span>Limpar</span>
          </button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
