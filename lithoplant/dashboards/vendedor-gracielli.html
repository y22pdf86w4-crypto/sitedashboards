<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Dashboard – Gracielli</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon -->
  <link rel="icon" href="../../assets/imagem/favicon.png" type="image/png" />

  <style>
    :root { --bar-extra: 60px; }

    html, body {
      height: 100%;
      margin: 0;
      background: #000;
    }

    .wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:#000;
    }

    .wrap iframe {
      position: absolute;
      left: 0; right: 0; top: 0;
      bottom: calc(-1 * var(--bar-extra));
      height: calc(100% + var(--bar-extra));
      width: 100%;
      border: 0;
      display: block;
    }

    .btn-voltar {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      border: none;
      border-radius: 999px;
      width: 32px;
      height: 32px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(15,23,42,0.9);
      color: #e5e7eb;
      border: 1px solid rgba(148,163,184,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .btn-voltar:hover {
      background: rgba(15,23,42,1);
    }

    /* Ajustes para telas menores: iframe ocupa 100vh de forma mais segura */
    @media (max-width: 768px) {
      .wrap {
        position: relative;
        height: 100vh;
        inset: 0;
        overflow: hidden;
      }

      .wrap iframe {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        height: 100%;
      }
    }

    /* Botão menor em celular pequeno */
    @media (max-width: 480px) {
      .btn-voltar {
        top: 8px;
        left: 8px;
        width: 28px;
        height: 28px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body onload="validarAcessoDashboardVip('lithoplant',['ctvcentrosul@lithoplant.com.br'])">

    ←
  </button>

  <div class="wrap">
    <iframe

      allowfullscreen="true">
    </iframe>
  </div>

  <script src="../../assets/js/global.js"></script>
</body>
</html>
