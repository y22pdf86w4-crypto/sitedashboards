<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Organograma Linhagro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Mesmos assets do menu -->
  <link rel="icon" href="../assets/imagem/favicon.png" type="image/png" />
  <link rel="stylesheet" href="../assets/css/global.css" />

  <style>
    :root {
      --bg-main: #020617;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.2);
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --header-height: 88px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #000 100%);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* HEADER igual ao do menu, com botão Voltar */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      width: 100%;
      height: var(--header-height);
      padding: 0.85rem clamp(1.25rem, 4vw, 2.5rem);
      background: radial-gradient(circle at top left, #22c55e20 0, #020617 45%, #020617 100%);
      border-bottom: 1px solid rgba(148, 163, 184, 0.28);
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.85),
        inset 0 -1px 0 rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-sizing: border-box;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 0;
      flex: 1;
    }

    .header-logo-pill {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      padding: 0.55rem 0.85rem;
      border-radius: 999px;
      background: radial-gradient(circle at 0 0, #22c55e26 0, rgba(15, 23, 42, 0.96) 45%, rgba(15, 23, 42, 0.98) 100%);
      box-shadow:
        0 0 0 1px rgba(15, 23, 42, 0.95),
        0 14px 40px rgba(0, 0, 0, 0.9);
    }

    .header-logo {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 0, #22c55e 0, #22c55e33 35%, transparent 70%);
      box-shadow:
        0 0 0 1px rgba(15, 23, 42, 1),
        0 0 26px rgba(34, 197, 94, 0.7);
    }

    .header-logo img {
      width: 70%;
      height: 70%;
      object-fit: contain;
    }

    .header-text {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 0;
    }

    .header-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #e5e7eb;
    }

    .header-subtitle {
      margin: 0;
      font-size: 0.8rem;
      color: #9ca3af;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.8);
      background: radial-gradient(circle at 30% -30%, #22c55e33, rgba(15, 23, 42, 0.98));
      color: #e5e7eb;
      font-size: 0.85rem;
      cursor: pointer;
      transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        border-color 0.18s ease,
        background 0.18s ease;
    }
    .btn-back-icon { font-size: 0.9rem; }
    .btn-back:hover {
      transform: translateY(-1px) scale(1.02);
      border-color: #22c55e;
      box-shadow: 0 14px 32px rgba(34, 197, 94, 0.5);
      background: radial-gradient(circle at 30% -30%, #22c55e55, rgba(15, 23, 42, 0.98));
    }
    .btn-back:active {
      transform: translateY(0) scale(0.97);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.9);
    }

    /* Conteúdo */
    .page-main {
      margin-top: var(--header-height);
      min-height: calc(100vh - var(--header-height));
      padding: 1.5rem 1.5rem 2.5rem;
      display: flex;
      justify-content: center;
      box-sizing: border-box;
    }

    .org-container {
      width: 100%;
      max-width: 1120px;
    }

    .org-panel {
      background: radial-gradient(circle at 0 0, #22c55e18 0, rgba(15, 23, 42, 0.96) 45%, rgba(15, 23, 42, 0.99) 100%);
      border-radius: 1.7rem;
      border: 1px solid rgba(148, 163, 184, 0.45);
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(15, 23, 42, 0.8);
      padding: 1.4rem 1.6rem 1.4rem;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-sizing: border-box;
    }

    .org-title {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .org-title span {
      background: linear-gradient(135deg, #22c55e, #a3e635);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .org-subtitle {
      margin: 0 0 1rem;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .org-frame {
      width: 100%;
      min-height: 70vh;
      border-radius: 1.25rem;
      border: 1px solid rgba(148, 163, 184, 0.45);
      background: radial-gradient(circle at 0 0, #22c55e11 0, #020617 45%, #020617 100%);
      overflow: hidden;
    }

    .org-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    @media (max-width: 768px) {
      .app-header {
        padding: 0.7rem 1rem;
        height: 80px;
      }
      :root { --header-height: 80px; }
      .page-main {
        padding: 1.2rem 1rem 2rem;
      }
      .org-panel {
        border-radius: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <!-- Header com botão Voltar -->
  <header class="app-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="header-logo-pill">
          <div class="header-logo">
            <!-- mesmo caminho do menu (a partir de /dashboards) -->
            <img src="../assets/imagem/logolinhagro.png" alt="Linhagro" />
          </div>
          <div class="header-text">
            <p class="header-title">Linhagro – Organograma</p>
            <p class="header-subtitle">Estrutura da equipe e áreas.</p>
          </div>
        </div>
      </div>

      <div class="header-right">
        <button
          type="button"
          class="btn-back"
          onclick="window.location.href='../index.html'"
        >
          <span class="btn-back-icon">⟵</span>
          <span>Voltar para dashboards</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo do organograma -->
  <main class="page-main">
    <div class="org-container">
      <section class="org-panel">
        <h1 class="org-title">Estrutura <span>Linhagro</span></h1>
        <p class="org-subtitle">
          Visualize o organograma completo da empresa, com diretoria, coordenações e equipes.
        </p>

        <div class="org-frame">
          <!-- Troque a imagem/iframe abaixo pelo seu organograma real -->
          <img src="../assets/imagem/organograma-linhagro.png" alt="Organograma Linhagro" />
          <!-- ou, se for um dashboard:
          <iframe src="URL_DO_ORGANOGRAMA" width="100%" height="100%" frameborder="0"></iframe>
          -->
        </div>
      </section>
    </div>
  </main>
</body>
</html>
